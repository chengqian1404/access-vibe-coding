[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "access-vibe-coding-backend"
version = "1.0.0"
description = "Access Vibe Coding - Backend Service"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
access-vibe-backend = "main:app"

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
